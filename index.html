<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0e">
<title>Le cadeau d'anniversaire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-START-->
<div id="app">
  <!-- Dégradés partagés : la lumière vient toujours d'en haut à gauche -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="objVol" cx="30%" cy="22%" r="95%">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".72" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
      </radialGradient>
      <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
      </linearGradient>
      <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".16" stop-color="#000" stop-opacity="0"/>
        <stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
      </linearGradient>
      <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".34"/>
      </linearGradient>
      <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
      </linearGradient>
      <linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".6" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gKnot" cx="35%" cy="30%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
      </radialGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6dc8c"/><stop offset=".5" stop-color="#d4a843"/><stop offset="1" stop-color="#a77a26"/>
      </linearGradient>
      <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a6a45"/><stop offset="1" stop-color="#6d4528"/>
      </linearGradient>
      <radialGradient id="bShade" cx="34%" cy="28%" r="80%">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".75" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".2"/>
      </radialGradient>
    </defs>
  </svg>
  <canvas id="room" aria-hidden="true"></canvas>
  <div id="objects" aria-label="La pièce"></div>

  <div id="hero" hidden>
    <div id="coreLight" aria-hidden="true"></div>
    <button id="gift" type="button" aria-label="Le cadeau">
      <!-- Couche extérieure : papier, ruban, nœud -->
      <svg class="layer L-outer" viewBox="0 0 220 250" aria-hidden="true">
        <defs>
          <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="4" cy="4" r="2.2" class="dot"/><circle cx="13" cy="13" r="2.2" class="dot"/>
          </pattern>
        </defs>
        <ellipse class="shadow" cx="110" cy="230" rx="94" ry="11"/>
        <g class="g-box">
          <rect x="34" y="122" width="152" height="106" rx="5" class="paper"/>
          <rect x="34" y="122" width="152" height="106" rx="5" fill="url(#dots)"/>
          <rect x="99" y="122" width="22" height="106" class="ribbon"/>
          <rect x="34" y="122" width="152" height="106" rx="5" fill="url(#gFront)"/>
          <rect x="34" y="122" width="152" height="106" rx="5" fill="url(#gSide)"/>
          <rect x="34" y="124" width="152" height="12" fill="url(#gUnder)"/>
          <path class="tear t1" d="M46 146 l9 6 -7 7 10 6"/>
          <path class="tear t2" d="M172 140 l-8 7 7 6 -9 7"/>
          <path class="tear t3" d="M60 204 l8 -6 5 8 9 -5"/>
          <path class="tear t4" d="M140 210 l8 -7 4 9 10 -5"/>
          <path class="tear t5" d="M176 182 l-10 4 6 7"/>
        </g>
        <rect class="g-seam" x="30" y="120" width="160" height="10" rx="5"/>
        <g class="g-lid">
          <path d="M26 104 L46 80 H174 L194 104 Z" class="paper"/>
          <path d="M26 104 L46 80 H174 L194 104 Z" fill="url(#dots)" opacity=".6"/>
          <path d="M33.5 95 H186.5 L182.3 90 H37.7 Z" class="ribbon-d"/>
          <path d="M99 104 L102 80 H118 L121 104 Z" class="ribbon"/>
          <path d="M26 104 L46 80 H174 L194 104 Z" fill="url(#gTop)"/>
          <rect x="26" y="104" width="168" height="24" rx="4" class="paper-d"/>
          <rect x="26" y="104" width="168" height="24" rx="4" fill="url(#dots)" opacity=".7"/>
          <rect x="99" y="104" width="22" height="24" class="ribbon"/>
          <rect x="26" y="104" width="168" height="24" rx="4" fill="url(#gLid)"/>
          <rect x="26" y="104" width="168" height="24" rx="4" fill="url(#gSide)"/>
          <path d="M29 104.6 H191" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>
        </g>
        <g class="g-bow">
          <g transform="translate(0 8)">
            <path d="M110 82 C 84 48, 52 58, 64 80 C 72 94, 98 90, 110 82 z" class="ribbon"/>
            <path d="M110 82 C 84 48, 52 58, 64 80 C 72 94, 98 90, 110 82 z" fill="url(#gKnot)"/>
            <path d="M110 82 C 136 48, 168 58, 156 80 C 148 94, 122 90, 110 82 z" class="ribbon-d"/>
            <path d="M110 82 C 136 48, 168 58, 156 80 C 148 94, 122 90, 110 82 z" fill="url(#gKnot)" opacity=".7"/>
            <path d="M104 86 L 88 112 L 98 110 L 104 120 Z" class="ribbon-d"/>
            <path d="M116 86 L 132 112 L 122 110 L 116 120 Z" class="ribbon"/>
            <circle cx="110" cy="83" r="10" class="ribbon-k"/>
            <circle cx="110" cy="83" r="10" fill="url(#gKnot)"/>
          </g>
        </g>
      </svg>
      <!-- Deuxième boîte en carton -->
      <svg class="layer L-box2" viewBox="0 0 220 250" aria-hidden="true" hidden>
        <ellipse class="shadow" cx="110" cy="230" rx="88" ry="11"/>
        <rect x="40" y="120" width="140" height="108" rx="3" fill="#c9a274"/>
        <rect x="100" y="120" width="20" height="108" fill="#ece0c8" opacity=".85"/>
        <rect x="40" y="120" width="140" height="108" rx="3" fill="url(#gFront)"/>
        <rect x="40" y="120" width="140" height="108" rx="3" fill="url(#gSide)"/>
        <rect x="40" y="122" width="140" height="12" fill="url(#gUnder)"/>
        <text x="110" y="188" text-anchor="middle" class="b2-text">FRAGILE ♡</text>
        <g class="b2-lid">
          <path d="M32 100 L48 80 H172 L188 100 Z" fill="#dcbb8f"/>
          <path d="M101 100 L103 80 H117 L119 100 Z" fill="#efe5d1"/>
          <path d="M32 100 L48 80 H172 L188 100 Z" fill="url(#gTop)"/>
          <rect x="32" y="100" width="156" height="24" rx="3" fill="#d2ad7f"/>
          <rect x="100" y="100" width="20" height="24" fill="#ece0c8" opacity=".85"/>
          <rect x="32" y="100" width="156" height="24" rx="3" fill="url(#gLid)"/>
          <rect x="32" y="100" width="156" height="24" rx="3" fill="url(#gSide)"/>
          <path d="M35 100.6 H185" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>
        </g>
      </svg>
      <!-- La lettre -->
      <svg class="layer L-letter" viewBox="0 0 220 250" aria-hidden="true" hidden>
        <ellipse class="shadow" cx="110" cy="226" rx="88" ry="10"/>
        <rect x="24" y="96" width="172" height="120" rx="6" fill="#f6efe4"/>
        <path d="M24 102 L110 168 L196 102" fill="none" stroke="#dccfb9" stroke-width="3"/>
        <path d="M24 212 L96 156 M196 212 L124 156" stroke="#e6dac6" stroke-width="2.4"/>
        <rect x="24" y="96" width="172" height="120" rx="6" fill="url(#gFront)" opacity=".7"/>
        <rect x="24" y="96" width="172" height="120" rx="6" fill="url(#gSide)" opacity=".6"/>
        <path class="lt-flap" d="M24 100 L110 40 L196 100 Z" fill="#efe5d4"/>
        <path d="M110 150 c-8 -10 -22 -4 -18 8 c3 8 18 16 18 16 s15 -8 18 -16 c4 -12 -10 -18 -18 -8 z" fill="#e35d7a"/>
        <path d="M110 150 c-8 -10 -22 -4 -18 8 c3 8 18 16 18 16 s15 -8 18 -16 c4 -12 -10 -18 -18 -8 z" fill="url(#gKnot)"/>
      </svg>
      <!-- Le petit coffre -->
      <svg class="layer L-chest" viewBox="0 0 220 250" aria-hidden="true" hidden>
        <ellipse class="shadow" cx="110" cy="228" rx="90" ry="11"/>
        <rect x="32" y="128" width="156" height="96" rx="8" fill="url(#gWood)"/>
        <path d="M36 150 H184 M36 196 H184" stroke="#000" stroke-opacity=".14" stroke-width="1.5"/>
        <rect x="32" y="166" width="156" height="10" fill="#5a3a22"/>
        <rect x="32" y="128" width="156" height="96" rx="8" fill="url(#gSide)"/>
        <rect x="32" y="130" width="156" height="12" fill="url(#gUnder)"/>
        <rect x="40" y="132" width="10" height="88" fill="url(#gGold)" opacity=".85"/><rect x="170" y="132" width="10" height="88" fill="url(#gGold)" opacity=".85"/>
        <g class="ch-lid">
          <path d="M32 132 V112 C32 76 188 76 188 112 V132 Z" fill="#8f6242"/>
          <path d="M32 132 V112 C32 76 188 76 188 112 V132 Z" fill="url(#gLid)"/>
          <path d="M40 104 C 60 86, 160 86, 180 104" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="32" y="120" width="156" height="10" fill="url(#gGold)"/>
          <rect x="40" y="96" width="10" height="26" fill="url(#gGold)" opacity=".85"/><rect x="170" y="96" width="10" height="26" fill="url(#gGold)" opacity=".85"/>
        </g>
        <rect x="92" y="122" width="36" height="44" rx="6" fill="url(#gGold)"/>
        <rect x="92" y="122" width="36" height="44" rx="6" fill="none" stroke="#fff" stroke-opacity=".35"/>
        <circle cx="110" cy="140" r="6" fill="#4a2f1a"/><rect x="107" y="142" width="6" height="12" rx="2" fill="#4a2f1a"/>
      </svg>
    </button>
  </div>

  <button id="bunny" type="button" aria-label="Le petit lapin" hidden>
    <svg viewBox="0 0 200 240" aria-hidden="true">
      <ellipse class="shadow" cx="100" cy="228" rx="58" ry="9"/>
      <g class="b-all">
        <g class="b-body">
          <circle cx="152" cy="192" r="13" class="fur-2"/>
          <ellipse cx="100" cy="184" rx="58" ry="44" class="fur-1"/>
          <ellipse cx="100" cy="184" rx="58" ry="44" fill="url(#bShade)" class="b-vol"/>
          <ellipse cx="100" cy="196" rx="34" ry="26" class="fur-3"/>
          <ellipse cx="70" cy="222" rx="21" ry="9" class="fur-2"/>
          <ellipse cx="130" cy="222" rx="21" ry="9" class="fur-2"/>
          <ellipse cx="84" cy="182" rx="9" ry="12" class="fur-2"/>
          <ellipse cx="116" cy="182" rx="9" ry="12" class="fur-2"/>
          <path class="b-loot" d="M60 170 c-20 10 -34 30 -26 40 c10 -6 18 -20 30 -26 z M66 168 c6 18 2 34 -6 44 c-4 -12 -2 -28 6 -44z"/>
        </g>
        <g class="b-head">
          <g class="b-ear b-ear-l">
            <ellipse cx="78" cy="48" rx="15" ry="42" transform="rotate(-10 78 48)" class="fur-1"/>
            <ellipse cx="78" cy="48" rx="15" ry="42" transform="rotate(-10 78 48)" fill="url(#bShade)" class="b-vol"/>
            <ellipse cx="78" cy="52" rx="7" ry="30" transform="rotate(-10 78 52)" class="inner"/>
          </g>
          <g class="b-ear b-ear-r">
            <ellipse cx="122" cy="48" rx="15" ry="42" transform="rotate(10 122 48)" class="fur-1"/>
            <ellipse cx="122" cy="48" rx="15" ry="42" transform="rotate(10 122 48)" fill="url(#bShade)" class="b-vol"/>
            <ellipse cx="122" cy="52" rx="7" ry="30" transform="rotate(10 122 52)" class="inner"/>
          </g>
          <ellipse cx="100" cy="112" rx="54" ry="45" class="fur-0"/>
          <ellipse cx="100" cy="112" rx="54" ry="45" fill="url(#bShade)" class="b-vol"/>
          <g class="b-eyes">
            <g class="b-eye b-eye-l"><ellipse cx="80" cy="110" rx="7.5" ry="9.5" class="eye"/><circle cx="82.5" cy="106" r="2.8" class="glint"/></g>
            <g class="b-eye b-eye-r"><ellipse cx="120" cy="110" rx="7.5" ry="9.5" class="eye"/><circle cx="122.5" cy="106" r="2.8" class="glint"/></g>
          </g>
          <path class="b-wink" d="M112 111 q8 -7 16 0"/>
          <path class="b-closed" d="M72 111 q8 6 16 0 M112 111 q8 6 16 0"/>
          <path class="b-brows" d="M70 96 l18 6 M130 96 l-18 6"/>
          <ellipse cx="67" cy="127" rx="9" ry="5" class="blush"/>
          <ellipse cx="133" cy="127" rx="9" ry="5" class="blush"/>
          <path d="M95 120 q5 -3 10 0 q-2 5 -5 6 q-3 -1 -5 -6z" class="nose"/>
          <path class="b-mouth" d="M94 129 q3 5 6 0 q3 5 6 0"/>
          <ellipse class="b-mouth-o" cx="100" cy="133" rx="4.5" ry="5.5"/>
        </g>
      </g>
    </svg>
    <span id="zzz" aria-hidden="true" hidden><i>z</i><i>z</i><i>z</i></span>
  </button>
  <p id="bunnySay" aria-live="polite"></p>

  <canvas id="dark" aria-hidden="true"></canvas>
  <section id="scene" hidden aria-live="polite"></section>
  <div id="spheres"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="texts">
    <p id="chapter" aria-live="polite"></p>
    <p id="lineTop" class="line line-top" aria-live="polite"></p>
    <p id="lineBottom" class="line line-bottom" aria-live="polite"></p>
    <p id="bubble" aria-live="polite"></p>
  </div>

  <div id="narr" hidden aria-live="polite">
    <div class="narr-orb" aria-hidden="true"><span class="narr-glow"></span><i></i><i></i><i></i><i></i><i></i></div>
    <div class="narr-body">
      <p class="narr-who"><b id="narrName"></b> <span id="narrLabel"></span></p>
      <p id="narrText"></p>
    </div>
  </div>

  <button id="albumBtn" type="button" aria-label="Ouvrir ton album" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    <span id="hud"></span>
  </button>

  <div id="controls">
    <button id="muteBtn" class="ctl" type="button" aria-label="Couper le son" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="ico-speaker" d="M4 9h4l5-4v14l-5-4H4z"/><path class="ico-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="ico-x" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button id="settingsBtn" class="ctl" type="button" aria-label="Réglages" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <div id="settings" hidden>
      <label for="vol">Volume</label>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8">
      <label class="check" for="calm"><input id="calm" type="checkbox"> Réduire les animations</label>
      <button id="fsBtn" type="button" class="link">Plein écran</button>
      <button id="restartBtn" type="button" class="link">Recommencer depuis le début</button>
    </div>
  </div>

  <button id="skipBtn" type="button" hidden>Passer <span aria-hidden="true">›</span></button>
  <div id="endBar" hidden></div>

  <section id="panel" hidden aria-live="polite">
    <div class="panel-box">
      <p id="panelTitle"></p>
      <div id="panelBody"></div>
      <div id="panelFoot"></div>
    </div>
  </section>

  <section id="memo" hidden>
    <div class="memo-card">
      <div class="polaroid"><div id="memoPhoto"></div><p id="memoTag"></p></div>
      <h3 id="memoTitle"></h3>
      <p id="memoText"></p>
      <p id="memoBack"></p>
      <div id="memoActions"></div>
    </div>
  </section>

  <section id="album" hidden aria-labelledby="albumTitle">
    <div class="album-box">
      <header><h2 id="albumTitle"></h2><button id="albumClose" type="button" class="pill ghost"></button></header>
      <p id="albumStats"></p>
      <div id="albumGrid"></div>
      <div id="albumVoices"></div>
    </div>
  </section>

  <section id="card" hidden aria-labelledby="cardTitle">
    <div class="card-paper">
      <h2 id="cardTitle"></h2>
      <div id="cardText"></div>
      <p id="cardSign"></p>
      <div id="cardActions"></div>
    </div>
  </section>

  <div id="blackout" hidden><p id="blackText"></p></div>

  <div id="splash" role="button" tabindex="0">
    <div class="splash-inner">
      <p class="splash-title"></p>
      <p class="splash-hint"></p>
      <p class="splash-sound"></p>
    </div>
  </div>
</div>
<!--BODY-END-->
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
